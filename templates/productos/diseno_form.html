{% extends 'base.html' %}

{% block title %}
Diseño
{% endblock %}

{% block content %}
<div class="form-contenedor">
<a class="volver" href="{{ producto.get_absolute_url }}">← Volver a {{ producto.nombre }}</a>
<p class="antetitulo">{{ producto.nombre }}</p>
<h1>{% if object %}Editar{% else %}Agregar{% endif %} diseño</h1>
<form method="post" class="panel">{% csrf_token %}{% include 'componentes/formulario.html' %}<div class="acciones">
<button type="submit">Guardar diseño</button>
<a href="{{ producto.get_absolute_url }}">Cancelar</a>
</div>
</form>
</div>
{% endblock %}
